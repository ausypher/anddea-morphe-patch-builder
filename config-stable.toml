
enable-module-update = true
parallel-jobs = 1
patches-version = "latest"
cli-version = "latest"

[YouTube]
app-name = "YouTube-Anddea"
enabled = true
patches-source = "anddea/revanced-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
version = "auto"
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
patcher-args = "-e 'Custom branding for YouTube' -OappIcon=res -e 'Translations for YouTube' -OselectedStringResources=ru,ru-rRU -OselectedTranslations=ru-rRU"

[Music]
app-name = "YouTube-Music-Anddea"
enabled = true
patches-source = "anddea/revanced-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
version = "auto"
arch = "arm64-v8a"
patcher-args = "-e 'Custom branding for YouTube Music' -OappIcon=mmt -e 'Theme' -OdarkThemeColor=@android:color/system_neutral1_900 -e 'Translations for YouTube Music' -OselectedStringResources=ru -OselectedTranslations=ru-rRU"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube-music"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.apps.youtube.music"

[GooglePhotos]
enabled = false
