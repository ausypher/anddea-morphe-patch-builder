
enable-module-update = true
parallel-jobs = 1
patches-version = "dev"
cli-version = "latest"

[YouTube]
app-name = "YouTube-Anddea"
enabled = true
patches-source = "anddea/revanced-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
arch = "arm64-v8a"
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"
patcher-args = "-e 'Custom branding for YouTube' -OappIcon=res -e 'Translations for YouTube' -OselectedStringResources=ru,ru-rRU -OselectedTranslations=ru-rRU"

[Music]
enabled = false

[GooglePhotos]
enabled = false
