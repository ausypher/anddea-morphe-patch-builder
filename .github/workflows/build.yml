name: Build Morphe

# Keep builds serialized: they publish releases and update the same branch.
concurrency:
  group: anddea-morphe-build-${{ inputs.channel || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: write

on:
  workflow_call:
    inputs:
      from_ci:
        type: boolean
        required: false
        default: true
      channel:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      channel:
        description: Build channel
        type: choice
        options:
          - dev
          - stable
        required: true
        default: dev

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      CHANNEL: ${{ inputs.channel || 'dev' }}
      UPDATE_BRANCH: update-${{ inputs.channel || 'dev' }}
    outputs:
      tag: ${{ steps.release_tag.outputs.tag }}
      next_ver_code: ${{ steps.next_ver_code.outputs.NEXT_VER_CODE }}
      channel: ${{ inputs.channel || 'dev' }}
      update_branch: update-${{ inputs.channel || 'dev' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get next version code
        id: next_ver_code
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          MAX_CODE=0

          if git fetch origin "$UPDATE_BRANCH:refs/remotes/origin/$UPDATE_BRANCH" 2>/dev/null; then
            while IFS= read -r FILE; do
              [ -n "$FILE" ] || continue
              CODE=$(git show "refs/remotes/origin/$UPDATE_BRANCH:$FILE" 2>/dev/null |
                jq -r '.versionCode // empty' |
                grep -E '^[0-9]+$' || true)
              if [ -n "$CODE" ] && [ "$CODE" -gt "$MAX_CODE" ]; then
                MAX_CODE="$CODE"
              fi
            done < <(
              git ls-tree -r --name-only refs/remotes/origin/$UPDATE_BRANCH |
                grep -E '(^|/)[^/]*-update\.json$' || true
            )
          fi

          if [ "$MAX_CODE" -eq 0 ]; then
            LEGACY_MAX=$(gh release list --limit 1000 --json tagName \
              -q '.[].tagName' |
              grep -E '^[0-9]+$' | sort -n | tail -n 1 || true)
            MAX_CODE="${LEGACY_MAX:-0}"
          fi

          echo "NEXT_VER_CODE=$((MAX_CODE + 1))" >> "$GITHUB_OUTPUT"
          echo "Previous versionCode: $MAX_CODE"
          echo "Next versionCode: $((MAX_CODE + 1))"

      - name: Create draft release
        id: release_tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DATE=$(date -u +%F)
          TAG=""
          for ATTEMPT in $(seq 1 100); do
            if [ "$ATTEMPT" -eq 1 ]; then
              CANDIDATE="$CHANNEL-$DATE"
            else
              CANDIDATE="$CHANNEL-$DATE-$((ATTEMPT - 1))"
            fi

            if gh release view "$CANDIDATE" >/dev/null 2>&1; then
              echo "Release $CANDIDATE already exists; trying next tag."
              continue
            fi

            if gh release create "$CANDIDATE" --draft --target "$GITHUB_SHA" \
              --title "YouTube ($CHANNEL) build $DATE" --notes ""; then
              TAG="$CANDIDATE"
              break
            fi

            if gh release view "$CANDIDATE" >/dev/null 2>&1; then
              echo "Tag $CANDIDATE was taken concurrently; trying next tag."
              continue
            fi
            echo "::error::Could not create draft release $CANDIDATE"
            exit 1
          done

          if [ -z "$TAG" ]; then
            echo "::error::Could not allocate a unique draft release tag"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Prepared draft release: $TAG"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: true

      - name: Set channel configuration
        run: |
          echo "CHANNEL=${{ needs.prepare.outputs.channel }}" >> "$GITHUB_ENV"
          echo "CONFIG_FILE=config-${{ needs.prepare.outputs.channel }}.toml" >> "$GITHUB_ENV"
          echo "UPDATE_BRANCH=${{ needs.prepare.outputs.update_branch }}" >> "$GITHUB_ENV"

      - uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install APKMirror scraper dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Restore signing keystore
        env:
          MORPHE_KEYSTORE_BASE64: ${{ secrets.MORPHE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$MORPHE_KEYSTORE_BASE64"
          printf '%s' "$MORPHE_KEYSTORE_BASE64" | base64 --decode > Morphe.keystore
          chmod 600 Morphe.keystore

      - name: Update config
        if: ${{ inputs.from_ci }}
        run: |
          if git fetch origin "$UPDATE_BRANCH" 2>/dev/null && git checkout "origin/$UPDATE_BRANCH" -- build.md; then
            UPDATE_CFG=$(./build.sh "$CONFIG_FILE" --config-update)
            if [ -n "$UPDATE_CFG" ]; then
              echo "Updated config: $UPDATE_CFG"
              echo "$UPDATE_CFG" > config.json
            fi
          fi

      - name: Start APKMirror Cloudflare solver
        run: |
          set -euo pipefail
          docker run -d --name apkmirror-cf-solver -p 8000:8000 ghcr.io/sarperavci/cloudflarebypassforscraping:latest
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/docs >/dev/null 2>&1; then
              echo "Cloudflare solver is ready"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Cloudflare solver did not become ready"
          docker logs apkmirror-cf-solver || true
          exit 1

      - name: Build modules/APKs
        run: |
          set -euo pipefail
          if [ -f config.json ]; then
            ./build.sh config.json
          else
            ./build.sh "$CONFIG_FILE"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          NEXT_VER_CODE: ${{ needs.prepare.outputs.next_ver_code }}

      - name: Validate build output
        if: success()
        run: |
          set -euo pipefail
          test -s build.md || { echo "::error::build.md was not generated"; exit 1; }
          shopt -s nullglob
          apks=(./build/*.apk)
          zips=(./build/*.zip)
          if [ "${#apks[@]}" -eq 0 ] && [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::No APK or module ZIP was produced"
            exit 1
          fi
          ls -lh ./build/*

      - name: Upload build payload
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: build-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.md
            build/*
          if-no-files-found: error
          retention-days: 1

      - name: Collect build diagnostics
        if: always()
        shell: bash
        run: |
          docker logs apkmirror-cf-solver > apkmirror-cf-solver.log 2>&1 || true
          {
            echo "Run result diagnostics"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Runner: $RUNNER_OS"
            echo
            echo "Docker containers:"
            docker ps -a || true
            echo
            echo "Build directory:"
            ls -lah ./build 2>&1 || true
          } > diagnostics.txt

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build.md
            build/
            diagnostics.txt
            apkmirror-cf-solver.log
          if-no-files-found: warn
          retention-days: 7

  release:
    needs: [prepare, build]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CHANNEL: ${{ needs.prepare.outputs.channel }}
      UPDATE_BRANCH: ${{ needs.prepare.outputs.update_branch }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download build payload
        if: ${{ needs.build.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: build-payload-${{ github.run_id }}-${{ github.run_attempt }}
          path: payload

      - name: Check build payload
        id: check
        if: ${{ needs.build.result == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          test -s payload/build.md
          shopt -s nullglob
          apks=(payload/build/*.apk)
          zips=(payload/build/*.zip)
          if [ "${#apks[@]}" -eq 0 ] && [ "${#zips[@]}" -eq 0 ]; then
            echo "::error::Build payload contains no APK or module ZIP"
            echo "has_payload=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "has_payload=true" >> "$GITHUB_OUTPUT"

      - name: Prepare release assets
        if: ${{ needs.build.result == 'success' && steps.check.outputs.has_payload == 'true' }}
        run: |
          set -euo pipefail
          if [ "$CHANNEL" = "dev" ]; then
            for FILE in payload/build/*.apk; do
              [ -f "$FILE" ] || continue
              BASENAME="$(basename "$FILE")"
              case "$BASENAME" in dev-*) continue ;; esac
              mv -- "$FILE" "payload/build/dev-$BASENAME"
            done
          fi

      - name: Upload release assets and publish
        id: publish
        if: ${{ needs.build.result == 'success' && steps.check.outputs.has_payload == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          ASSETS=(payload/build/*)
          test "${#ASSETS[@]}" -gt 0

          PATCH_VERSION=$(grep -m1 '^Patches:' payload/build.md |
            grep -oE 'patches-[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.-]+)?\.mpp' |
            head -n1 | sed -E 's/^patches-//; s/\.mpp$//' || true)

          if [ -z "$PATCH_VERSION" ]; then
            echo "::error::Could not determine patch version from build.md"
            exit 1
          fi

          gh release upload "$TAG" "${ASSETS[@]}" --clobber
          if [ "$CHANNEL" = "dev" ]; then
            gh release edit "$TAG" --title "$PATCH_VERSION (dev)" --notes-file payload/build.md --prerelease
          else
            gh release edit "$TAG" --title "$PATCH_VERSION (stable)" --notes-file payload/build.md --prerelease=false
          fi
          echo "Published $TAG ($PATCH_VERSION, $CHANNEL)"

      - name: Update modules changelog and update json
        if: ${{ needs.build.result == 'success' && steps.check.outputs.has_payload == 'true' && steps.publish.outcome == 'success' }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          NEXT_VER_CODE: ${{ needs.prepare.outputs.next_ver_code }}
          CHANNEL: ${{ needs.prepare.outputs.channel }}
          UPDATE_BRANCH: ${{ needs.prepare.outputs.update_branch }}
        run: |
          set -euo pipefail
          cp payload/build.md build.md
          if git fetch origin "$UPDATE_BRANCH"; then
            git checkout -B "$UPDATE_BRANCH" "origin/$UPDATE_BRANCH"
          else
            echo "No update branch exists yet; creating $UPDATE_BRANCH for the first build."
            git switch --orphan "$UPDATE_BRANCH"
          fi

          get_update_json() {
            jq -n --arg version "$1" --argjson versionCode "$NEXT_VER_CODE" \
              --arg zipUrl "$2" \
              --arg changelog "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$UPDATE_BRANCH/build.md" \
              '{version:$version, versionCode:$versionCode, zipUrl:$zipUrl, changelog:$changelog}'
          }

          shopt -s nullglob
          cd payload/build
          for OUTPUT in *module*.zip; do
            ZIP_S=$(unzip -p "$OUTPUT" module.prop)
            UPDATE_JSON=$(printf '%s\n' "$ZIP_S" | grep 'updateJson' | head -n1 || true)
            [ -n "$UPDATE_JSON" ] || continue
            UPDATE_JSON="${UPDATE_JSON##*/}"
            VER=$(printf '%s\n' "$ZIP_S" | grep '^version=' | head -n1 | cut -d= -f2-)
            [ -n "$VER" ] || continue
            DLURL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$TAG/$OUTPUT"
            get_update_json "$VER" "$DLURL" > "../../$UPDATE_JSON"
          done
          cd ../..
          find . -name "*-update.json" | grep . >/dev/null || touch dummy-update.json
          cp payload/build.md build.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.md *-update.json dummy-update.json 2>/dev/null || git add build.md *-update.json
          if ! git diff --cached --quiet; then
            git commit -m "Bump $CHANNEL version $NEXT_VER_CODE"
            git push origin "HEAD:$UPDATE_BRANCH"
          else
            echo "No update-branch changes."
          fi

      - name: Delete draft when build did not produce a valid payload
        if: ${{ always() && needs.prepare.result == 'success' && (needs.build.result != 'success' || steps.check.outputs.has_payload != 'true') }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release delete "$TAG" --yes || true
